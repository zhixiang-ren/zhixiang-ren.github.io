<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .edge {
      fill: none;
      stroke: #52525b; /* 哑光烟灰 Zinc-600 */
      stroke-width: 6;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .edge-back {
      fill: none;
      stroke: #52525b;
      stroke-width: 6;
      stroke-linejoin: round;
      stroke-linecap: round;
      opacity: 0.35; /* 后方维度降低透明度，增强错觉深度 */
    }
    @media (prefers-color-scheme: dark) {
      .edge { stroke: #d4d4d8; } /* 暗黑模式自动反转为亮灰 Zinc-300 */
      .edge-back { stroke: #d4d4d8; }
    }
  </style>

  <!-- 外部六边形轮廓 -->
  <polygon class="edge" points="50,10 85,30 85,70 50,90 15,70 15,30" />

  <!-- 前向空间的三维投射 -->
  <polyline class="edge" points="15,30 50,52 85,30" />
  <line class="edge" x1="50" y1="52" x2="50" y2="90" />

  <!-- 后向空间的三维投射（形成时空错觉与高维穿透） -->
  <polyline class="edge-back" points="15,70 50,48 85,70" />
  <line class="edge-back" x1="50" y1="10" x2="50" y2="48" />
</svg>

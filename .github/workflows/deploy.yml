name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync_scholar:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Refresh citation metrics
        env:
          SCHOLAR_AUTHOR_KEY: ec_pCdEAAAAJ
          SCHOLAR_PROXY_URL: ${{ secrets.SCHOLAR_PROXY_URL }}
        run: python scripts/fetch_scholar_stats.py --allow-stale

      - name: Persist changed metrics
        shell: bash
        run: |
          if git diff --quiet -- src/content/scholar.json; then
            echo "Scholar metrics are unchanged or the fetch kept the stale snapshot."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/scholar.json
          git commit -m "chore: refresh Scholar metrics"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

  build:
    needs: sync_scholar
    if: ${{ !cancelled() && (needs.sync_scholar.result == 'success' || needs.sync_scholar.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Check Python crawler
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.11.7"
          args: "check"
          src: "./scripts"

      - name: Check Python formatting
        run: ruff format --check scripts

      - name: Configure GitHub Pages path
        shell: bash
        run: |
          echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REPOSITORY#*/}" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi

      - name: Build and upload site
        uses: withastro/action@v6

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

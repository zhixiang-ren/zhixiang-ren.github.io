  - doi: 10.1021/acs.jcim.5c03204
    abstractFallback:
      summary: >-
        The authors present a module that helps enzyme kinetics predictors generalize
        to enzymes with sequences unlike those in their training data. It trains
        models to learn consistent representations from original and perturbed
        enzyme–substrate pairs. Across benchmarks defined by sequence similarity,
        adding the module improved estimates of turnover rates and Michaelis constants.
      url: https://pubmed.ncbi.nlm.nih.gov/42037561/

  - doi: 10.1016/j.drudis.2026.104796
    abstractFallback:
      summary: >-
        This review surveys how AI can help design drugs that bring biomolecules
        together to change their function. It covers target and partner selection,
        prediction of complex structures, and candidate design across degradative
        and nondegradative approaches. The authors emphasize benchmarks grounded in
        mechanism, analysis of failed predictions, and early evaluation of whether
        candidates are practical to develop.
      url: https://pubmed.ncbi.nlm.nih.gov/42705572/
